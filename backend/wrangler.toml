name = "reach-ai-instagram"
main = "worker.js"
compatibility_date = "2026-08-25"

[vars]
APP_ORIGIN = "https://raw.githack.com/banerjeeramen2002/Portfolio/main/reach-ai-autopost.html"

[[kv_namespaces]]
binding = "QUEUE_KV"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "reach-ai-media"

[triggers]
crons = ["*/5 * * * *"]
